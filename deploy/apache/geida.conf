# GEIDA (React frontend + Django API) on Apache.
# Copy to /etc/apache2/sites-available/geida.conf and adjust paths (see deploy/README.md).
# On the terrawatch server the enabled site is named geida-platform.conf.
# backend/media/ (analysis outputs, imports) is not aliased on purpose: Django serves
# those files through views that check the user's access.
#   sudo a2enmod ssl proxy proxy_http headers expires deflate rewrite
#   sudo certbot certonly --apache -d geida.terrawatch.net

<VirtualHost *:80>
    ServerName geida.terrawatch.net
    Redirect permanent / https://geida.terrawatch.net/
</VirtualHost>

<VirtualHost *:443>
    ServerName geida.terrawatch.net

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/geida.terrawatch.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/geida.terrawatch.net/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"

    # --- React app (npm run build -> frontend/dist)
    DocumentRoot /home/ecduser/isdb_geida/frontend/dist
    <Directory /home/ecduser/isdb_geida/frontend/dist>
        Options -Indexes +FollowSymLinks
        Require all granted
        # Client-side routes (/geo-portal, /accounts/sign-in, ...) all load index.html.
        FallbackResource /index.html
    </Directory>
    # Analytics (the GIS workspace) is part of the React app. Its static files
    # (basemap fonts, Cesium assets, plugins) are copied to dist/gis-assets/.
    <Directory /home/ecduser/isdb_geida/frontend/dist/gis-assets>
        # Missing files must 404, not fall back to the app's index.html.
        FallbackResource disabled
    </Directory>
    <LocationMatch "^/gis-assets/(geolibre-runtime-config\.js|deployment\.json)$">
        Header set Cache-Control "no-cache, must-revalidate"
    </LocationMatch>

    # Hashed build files never change; index.html is always revalidated.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    # Processing engine files: module worker (.mjs) and WebAssembly.
    AddType text/javascript .mjs
    AddType application/wasm .wasm
    AddOutputFilterByType DEFLATE text/html text/javascript application/javascript application/wasm application/json application/geo+json text/css image/svg+xml

    # --- Django admin static files (python manage.py collectstatic)
    Alias /static/ /home/ecduser/isdb_geida/backend/staticfiles/
    <Directory /home/ecduser/isdb_geida/backend/staticfiles>
        Require all granted
    </Directory>

    # --- Django API and admin via Gunicorn
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # GeoTIFF clip downloads (via TiTiler) can take up to ~2 minutes.
    ProxyTimeout 180
    ProxyPass        /api/   http://127.0.0.1:8012/api/
    ProxyPassReverse /api/   http://127.0.0.1:8012/api/
    ProxyPass        /admin/ http://127.0.0.1:8012/admin/
    ProxyPassReverse /admin/ http://127.0.0.1:8012/admin/

    ErrorLog ${APACHE_LOG_DIR}/geida_error.log
    CustomLog ${APACHE_LOG_DIR}/geida_access.log combined
</VirtualHost>
