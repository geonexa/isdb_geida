id: population_change
version: 0.2.0
title: Population change
question: How fast has the population grown since 2000?
description: >
  Compares the population of two years: WorldPop (100 m, any two years 2015–2030, with the
  population of every year between) by default, or the GHSL grid (every five years 1975–2030) for
  longer histories. Reports population at both dates, change and average yearly growth rate, the
  same per administrative unit, and a map of where people were added or lost.
status: experimental
category: people
themes: [social, urban, health, education, water]
phases: [preparation, completion]
cri: []
inputs:
  required:
    - {name: population, type: raster, default: worldpop, label: "Population (WorldPop R2025A, 100 m)"}
parameters:
  - {name: population_dataset, type: choice, default: worldpop, label: Population data,
     choices: [{value: worldpop, label: "WorldPop (yearly 2015–2030)"}, {value: ghsl_pop, label: "GHSL (every 5 years, 1975–2030)"}]}
  - {name: year_from, type: number, default: 2015, min: 1975, max: 2030, label: From year}
  - {name: year_to, type: number, default: 2025, min: 1975, max: 2030, label: To year}
  - {name: zone_level, type: choice, default: 2, label: Summarise by,
     choices: [{value: 1, label: Province / region (level 1)}, {value: 2, label: District (level 2)}, {value: 3, label: Sub-district (level 3)}]}
outputs:
  - {type: metric, name: population_from}
  - {type: metric, name: population_to}
  - {type: metric, name: change_pct}
  - {type: metric, name: growth_rate}
  - {type: table, name: per_zone}
  - {type: table, name: by_year, optional: true}
  - {type: raster, name: change}
requires: [gdal]
limits: {max_area_km2: 100000}
queue: raster
runtime: under a minute
citations: ["WorldPop Global2 R2025A v1 (University of Southampton), DOI 10.5258/SOTON/WP00839, CC BY 4.0",
            "GHS-POP R2023A, GHSL Data Package 2023, European Commission JRC (Schiavina et al. 2023), CC BY 4.0"]
steps:
  - read: both years from the same source on the same UTM grid (sum resampling), WorldPop for 2015–2030, else GHSL epochs
  - by_year: WorldPop count for every year between (API /trend)
  - change: people added or lost per cell; total change and compound yearly growth rate
  - per_zone: both populations, change and growth rate per admin unit
