id: stream_network
version: 0.1.0
title: Stream network and order
question: Where do streams run, how long are they by order, and how dense is the drainage?
description: >
  Derives the stream network from the Copernicus 30 m elevation model with WhiteboxTools: the
  DEM is conditioned (depressions breached), then flow direction and accumulation, streams where the upstream area exceeds a threshold, and their
  Strahler order. Reports stream length per order, drainage density (km per km²) for the area
  and per administrative unit, the length of rivers and streams mapped in OpenStreetMap for
  comparison, and maps the streams by order.
status: experimental
category: water
themes: [water, agriculture, transport, environment]
phases: [preparation]
cri: []
inputs:
  required:
    - {name: dem, type: raster, default: elevation, label: Elevation (Copernicus DEM GLO-30)}
  optional:
    - {name: waterways, type: vector_line, default: osm_waterways, label: Rivers and streams (OpenStreetMap), color: "#2B83BA"}
parameters:
  - {name: threshold_km2, type: number, default: 1, min: 0.1, max: 100, label: Stream starts at upstream area (km²)}
  - {name: zone_level, type: choice, default: 2, label: Summarise by,
     choices: [{value: 1, label: Province / region (level 1)}, {value: 2, label: District (level 2)}, {value: 3, label: Sub-district (level 3)}]}
outputs:
  - {type: metric, name: stream_km}
  - {type: metric, name: drainage_density}
  - {type: metric, name: max_order}
  - {type: metric, name: osm_km, optional: true}
  - {type: table, name: by_order}
  - {type: table, name: per_zone}
  - {type: vector, name: streams}
requires: [gdal, whitebox]
limits: {max_area_km2: 20000}
queue: heavy
runtime: under a minute for 10,000 km²
citations: ["Copernicus DEM GLO-30 (ESA)", "WhiteboxTools (Lindsay 2016), University of Guelph, MIT licence",
            "© OpenStreetMap contributors (ODbL)"]
steps:
  - read: Copernicus DEM with a 5 km margin (catchments reach beyond the area), local UTM zone, 30 m
  - flow: least-cost breaching of depressions then filling, D8 flow direction and accumulation (WhiteboxTools, cached)
  - streams: cells where upstream area >= threshold, vectorised one line per link
  - order: Strahler order (WhiteboxTools StrahlerStreamOrder)
  - summary: km per order and drainage density inside the area and per admin unit; OSM waterways length for comparison
