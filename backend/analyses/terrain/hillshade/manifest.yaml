id: hillshade
version: 0.1.0
title: Hillshade and relief
question: What does the relief look like, for maps and reports?
description: >
  Shades the terrain from the Copernicus 30 m elevation model as if lit by the sun from a
  chosen direction and height, giving a relief map for reports and as a backdrop for other
  results. Also reports the local relief (elevation range) of the area and per unit.
status: experimental
category: terrain
themes: [infrastructure, water, agriculture]
phases: [preparation]
cri: []
inputs:
  required:
    - {name: dem, type: raster, default: elevation, label: Elevation (Copernicus DEM GLO-30)}
parameters:
  - {name: azimuth, type: number, default: 315, min: 0, max: 360, label: Sun direction (degrees from north)}
  - {name: altitude, type: number, default: 45, min: 5, max: 90, label: Sun height (degrees above horizon)}
  - {name: z_factor, type: number, default: 1, min: 0.5, max: 5, label: Vertical exaggeration}
  - {name: zone_level, type: choice, default: 2, label: Summarise by,
     choices: [{value: 1, label: Province / region (level 1)}, {value: 2, label: District (level 2)}, {value: 3, label: Sub-district (level 3)}]}
outputs:
  - {type: metric, name: relief}
  - {type: table, name: per_zone}
  - {type: raster, name: hillshade, legend: legend.yaml}
requires: [gdal]
limits: {max_area_km2: 60000}
queue: raster
runtime: under a minute for 10,000 km²
citations: [Copernicus DEM GLO-30 (ESA)]
steps:
  - read: dem with a 250 m margin, local UTM zone
  - hillshade: Horn's 3×3 method, sun azimuth and altitude, vertical exaggeration
