id: school_access
version: 0.1.0
title: Population beyond walking distance of a school
question: How many people in each admin unit live more than 5 km from a school?
description: >
  Distance from every populated cell to the nearest school, multiplied by the
  population and summed per administrative unit. Schools just outside the project
  area count too.
status: curated
category: access
themes: [education]
phases: [preparation, implementation, completion]
cri:
  - {code: "9.1", role: estimate}
  - {code: "9.3", role: verify}
inputs:
  required:
    - {name: schools, type: vector_point, default: osm_schools, label: Schools}
    - {name: population, type: raster, default: worldpop_2020, label: Population}
  optional:
    - {name: census, type: table, label: "Census out-of-school children (pop6_12, oos6_12)"}
parameters:
  - {name: threshold_m, type: number, default: 5000, min: 500, max: 50000, label: Distance threshold (m)}
  - {name: zone_level, type: choice, default: 3, label: Summarise by,
     choices: [{value: 1, label: Province / region (level 1)}, {value: 2, label: District (level 2)}, {value: 3, label: Sub-district (level 3)}]}
outputs:
  - {type: metric, name: headline}
  - {type: table, name: per_zone}
  - {type: image, name: beyond_map}
  - {type: vector, name: school_points}
steps:
  - points_to_raster: schools
  - euclidean_distance: {}
  - reclass: "> threshold_m"
  - multiply: population
  - zonal_stats: sum
citations: [OpenStreetMap, WorldPop 2020]
acceptance:
  moroto: {people_beyond_5km: 14800, share_beyond: 0.11, tapac_share_beyond: 0.41}
