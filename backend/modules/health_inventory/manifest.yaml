id: health_inventory
version: 0.1.0
title: Health facilities in the area
question: Which hospitals, clinics and health posts are mapped in the project area?
description: >
  Lists the health facilities mapped in OpenStreetMap inside the area of influence
  (hospitals, clinics, health centres and posts, doctors), counts them by type and
  per administrative unit, and shows them on the map.
status: curated
category: social
themes: [health]
phases: [preparation, implementation, completion]
cri:
  - {code: "8.1", role: verify}
inputs:
  required:
    - {name: health, type: vector_point, default: osm_health, label: Health facilities}
parameters:
  - {name: zone_level, type: choice, default: 3, label: Summarise by,
     choices: [{value: 1, label: Province / region (level 1)}, {value: 2, label: District (level 2)}, {value: 3, label: Sub-district (level 3)}]}
outputs:
  - {type: metric, name: count}
  - {type: table, name: by_kind}
  - {type: table, name: per_zone}
  - {type: table, name: list}
  - {type: vector, name: points}
  - {type: file, name: csv}
steps:
  - select_by_location: [health, area]
  - count_by_zone: {}
  - count_by_type: [healthcare, amenity]
citations: [OpenStreetMap]
