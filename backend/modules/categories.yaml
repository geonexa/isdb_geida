# Analysis categories: how the catalogue groups modules in the Analyses tab.
# Each module's manifest names one category id (`category: social`).
# icon: a lucide icon name the frontend knows (see AnalysesTab CATEGORY_ICONS);
# unknown names fall back to a generic icon.
# order: position in the catalogue (lowest first).

categories:
  - id: area_profile
    title: Area profile
    description: What is mapped in the project area?
    icon: map
    order: 1
  - id: social
    title: Social services
    description: Which schools, clinics and community facilities exist, and where?
    icon: school
    order: 2
  - id: access
    title: Neighbourhood and access
    description: Who lives near or far from services and roads? What is around a site?
    icon: route
    order: 3
  - id: built
    title: Built environment
    description: How many buildings, how dense, what kind?
    icon: building
    order: 4
  - id: networks
    title: Infrastructure networks
    description: What roads, water and power assets exist?
    icon: network
    order: 5
