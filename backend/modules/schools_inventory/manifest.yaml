id: schools_inventory
version: 0.2.0
title: Schools in the area
question: Which schools are mapped inside the project area, and where?
description: >
  Lists the schools, kindergartens, colleges and universities mapped in OpenStreetMap
  inside the area of influence, counts them by education level and per administrative
  unit, and shows them on the map. A quick inventory to check against the project's
  school list and imagery.
status: curated
category: social
themes: [education]
phases: [preparation, implementation, completion]
cri:
  - {code: "9.3", role: verify}
inputs:
  required:
    - {name: schools, type: vector_point, default: osm_schools, label: Schools}
parameters:
  - {name: zone_level, type: choice, default: 3, label: Summarise by,
     choices: [{value: 1, label: Province / region (level 1)}, {value: 2, label: District (level 2)}, {value: 3, label: Sub-district (level 3)}]}
outputs:
  - {type: metric, name: count}
  - {type: table, name: by_kind}
  - {type: table, name: per_zone}
  - {type: table, name: list}
  - {type: vector, name: points}
  - {type: file, name: csv}
steps:
  - select_by_location: [schools, area]
  - count_by_zone: {}
  - count_by_type: isced:level
citations: [OpenStreetMap]
